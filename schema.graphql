"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

type GlobalStats {
  hymnbooks: Int!
  hymns: Int!
  audios: Int!
  activeReviewers: Int!
}

type HeatmapBucketType {
  date: Date!
  count: Int!
}

type HymnAudioType {
  id: UUID!
  waveformPeaks: [Int!]!
  url: String!
  durationSeconds: Float
  uploadedBy: UserType
}

type HymnBookStatsType {
  hymnsTotal: Int!
  hymnsReviewed: Int!
  audiosApproved: Int!
}

type HymnBookType {
  id: UUID!
  name: String!
  slug: String!
  isPublished: Boolean!
  stats: HymnBookStatsType!
  hymns: [HymnType!]!
}

type HymnType {
  id: UUID!
  number: Int!
  title: String!
  reviewStatus: ReviewStatus!
  body: String!
  previousInBook: HymnType
  nextInBook: HymnType
  siblingsWithSameNumber: [HymnType!]!
  audios(approvedOnly: Boolean! = true): [HymnAudioType!]!
}

input HymnUpdateInput {
  title: String
  text: String
  number: Int
  section: String
  style: String
  repetitions: String
  extraInstructions: String
  offeredTo: String
}

type LoginError {
  message: String!
}

union LoginResult = LoginSuccess | LoginError

type LoginSuccess {
  user: UserType!
}

type Mutation {
  login(username: String!, password: String!): LoginResult!
  logout: Boolean!
  setReviewStatus(pk: ID!, status: ReviewStatus!): SetReviewStatusResult!
  updateHymn(pk: ID!, input: HymnUpdateInput!): UpdateHymnResult!
  toggleFavorite(hymnPk: ID!): ToggleFavoriteResult!
}

type NotFoundError {
  message: String!
}

type NotificationType {
  id: UUID!
  notificationType: String!
  title: String!
  message: String!
  link: String!
  isRead: Boolean!
  createdAt: DateTime!
}

type PermissionDeniedError {
  message: String!
}

type Query {
  hymnbooks: [HymnBookType!]!
  hymnbook(slug: String!): HymnBookType
  hymn(pk: ID!): HymnType
  currentUser: UserType
  userProfile(username: String!): UserProfileType
  notifications(unreadOnly: Boolean! = false): [NotificationType!]!
  hourlyFeatured: [HymnBookType!]!
  search(q: String!, kind: SearchKind! = ALL): SearchResultsType!
  globalStats: GlobalStats!
}

enum ReviewStatus {
  NOT_REVIEWED
  IN_REVIEW
  REVIEWED
}

enum SearchKind {
  ALL
  HYMN
  HYMNBOOK
}

type SearchResultsType {
  hymns: [HymnType!]!
  hymnbooks: [HymnBookType!]!
}

union SetReviewStatusResult = HymnType | PermissionDeniedError | NotFoundError

union ToggleFavoriteResult = ToggleFavoriteSuccess | PermissionDeniedError | NotFoundError

type ToggleFavoriteSuccess {
  favorited: Boolean!
}

scalar UUID

union UpdateHymnResult = HymnType | PermissionDeniedError | NotFoundError | ValidationError

type UserProfileType {
  user: UserType!
  followersCount: Int!
  followingCount: Int!
  uploadedAudios: [HymnAudioType!]!
  followers(first: Int! = 20, offset: Int! = 0): [UserType!]!
  following(first: Int! = 20, offset: Int! = 0): [UserType!]!
  activityHeatmap(days: Int! = 365): [HeatmapBucketType!]!
}

type UserType {
  id: ID!
  username: String!
  email: String!
}

type ValidationError {
  message: String!
  field: String
}
