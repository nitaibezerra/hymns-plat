type GlobalStats {
  hymnbooks: Int!
  hymns: Int!
  audios: Int!
  activeReviewers: Int!
}

type HymnAudioType {
  id: UUID!
}

type HymnBookType {
  id: UUID!
  name: String!
  slug: String!
  isPublished: Boolean!
}

type HymnType {
  id: UUID!
  number: Int!
  title: String!
  reviewStatus: ReviewStatus!
}

input HymnUpdateInput {
  title: String
  text: String
  number: Int
  section: String
  style: String
  repetitions: String
  extraInstructions: String
  offeredTo: String
}

type LoginError {
  message: String!
}

union LoginResult = LoginSuccess | LoginError

type LoginSuccess {
  user: UserType!
}

type Mutation {
  login(username: String!, password: String!): LoginResult!
  logout: Boolean!
  setReviewStatus(pk: ID!, status: ReviewStatus!): SetReviewStatusResult!
  updateHymn(pk: ID!, input: HymnUpdateInput!): UpdateHymnResult!
  toggleFavorite(hymnPk: ID!): ToggleFavoriteResult!
}

type NotFoundError {
  message: String!
}

type PermissionDeniedError {
  message: String!
}

type Query {
  hymnbooks: [HymnBookType!]!
  hymnbook(slug: String!): HymnBookType
  hymn(pk: ID!): HymnType
  currentUser: UserType
  globalStats: GlobalStats!
}

enum ReviewStatus {
  NOT_REVIEWED
  IN_REVIEW
  REVIEWED
}

union SetReviewStatusResult = HymnType | PermissionDeniedError | NotFoundError

union ToggleFavoriteResult = ToggleFavoriteSuccess | PermissionDeniedError | NotFoundError

type ToggleFavoriteSuccess {
  favorited: Boolean!
}

scalar UUID

union UpdateHymnResult = HymnType | PermissionDeniedError | NotFoundError | ValidationError

type UserType {
  id: ID!
  username: String!
  email: String!
}

type ValidationError {
  message: String!
  field: String
}
