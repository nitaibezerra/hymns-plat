[project]
name = "hymns-plat"
version = "0.1.0"
description = "Portal de Hinários do Santo Daime"
authors = [{ name = "Nitai Bezerra" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "django>=5.1,<6.0",
    "wagtail>=6.4,<7.0",
    "psycopg2-binary>=2.9,<3.0",
    "django-allauth>=65.3,<66.0",
    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "weasyprint>=63,<64",
    "pillow>=11.1,<12.0",
    "python-magic>=0.4,<0.5",
    "pyyaml>=6.0,<7.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.8,<7.0",
    "django-environ>=0.11,<0.12",
    "django-storages[s3]>=1.14,<2.0",
    "boto3>=1.35,<2.0",
    # Pinned to a specific commit so CI is reproducible. Para trabalhar num
    # checkout local, rode: uv pip install -e ../hymn-ocr
    "hymn-ocr",
    "cryptography>=47.0.0,<48.0.0",
    "strawberry-graphql-django>=0.50,<1.0",
    "strawberry-graphql>=0.250,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "factory-boy>=3.3,<4.0",
    "playwright>=1.49,<2.0",
    "black>=24.10,<25.0",
    "isort>=5.13,<6.0",
    "ruff>=0.8,<0.9",
    "pre-commit>=4.0,<5.0",
    "django-debug-toolbar>=5.0,<6.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocs-mermaid2-plugin>=1.1,<2.0",
]

[tool.uv]
# Projeto não é uma biblioteca empacotável — é um app Django. uv não deve
# tentar buildar/instalar como package.
package = false

[tool.uv.sources]
# `hymn-ocr` é um pacote externo nosso — pin no commit `main`. Não publica em
# PyPI; uv resolve direto do GitHub.
hymn-ocr = { git = "https://github.com/nitaibezerra/hymn-ocr.git", branch = "main" }

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations", ".venv"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F405", "F403"]  # Allow star imports in Django settings

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --cov=apps --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
fail_under = 80
