<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- TODO(Marco 6): `static/favicon.png` e os ícones do manifest ainda não
         existem — não há arte de marca no repo. Gap registrado em
         `_plan/marco6-decisoes.md` (seção "Ícones PWA"). -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- Dois theme-color: a UI do navegador acompanha claro/escuro. Valores
         espelham `--color-bg` de `static/css/design-tokens.css` (paleta "Luz do
         Firmamento"): papel claro #F6EFE2 / noite #0E1320. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F6EFE2"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0E1320"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
