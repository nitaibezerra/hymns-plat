name: CI

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '_design/**'
      - '_plan/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run Black
        run: uv run black --check .

      - name: Run isort
        run: uv run isort --check-only .

      - name: Run Ruff
        run: uv run ruff check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hymnplat
          POSTGRES_USER: hymnplat
          POSTGRES_PASSWORD: hymnplat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://hymnplat:hymnplat@localhost:5432/hymnplat

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv run pytest tests/unit/ --cov=apps --cov-report=xml --cov-report=term-missing --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hymnplat
          POSTGRES_USER: hymnplat
          POSTGRES_PASSWORD: hymnplat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://hymnplat:hymnplat@localhost:5432/hymnplat
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-e2e

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: uv run python manage.py migrate --noinput

      - name: Create test user and sample data
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          uv run python manage.py shell -c "
          from apps.users.models import User
          from apps.hymns.models import HymnBook, Hymn

          # Create test user
          if not User.objects.filter(email='teste2e@example.com').exists():
              User.objects.create_user('teste2e', 'teste2e@example.com', 'testpass123')
              print('Test user created')

          # Create sample hymnbook
          if not HymnBook.objects.exists():
              hb = HymnBook.objects.create(name='O Cruzeiro', owner_name='Mestre Irineu', intro_name='Cruzeiro', is_published=True)
              Hymn.objects.create(hymn_book=hb, number=1, title='Lua Branca', text='Lua branca da luz serena')
              Hymn.objects.create(hymn_book=hb, number=2, title='Tuperci', text='Tuperci é um anjo')
              print('Sample data created')
          "

      - name: Start Django server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          # Fake credentials so the Google button renders in E2E. The button
          # only triggers a redirect to accounts.google.com (which the tests
          # don't follow) — the values themselves are never validated.
          GOOGLE_OAUTH_CLIENT_ID: e2e-fake-client-id
          GOOGLE_OAUTH_CLIENT_SECRET: e2e-fake-secret
        run: |
          uv run python manage.py runserver 9000 &
          sleep 5
          curl -f http://localhost:9000/ || (echo "Server failed to start" && exit 1)

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ --tb=short

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            tests/e2e/screenshots/
            test-results/
          retention-days: 7
