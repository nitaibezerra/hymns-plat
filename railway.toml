# Railway deploy config
# https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# /health/ probe is intentionally disabled here.
# Railway's internal healthcheck request is rejected by ALLOWED_HOSTS;
# we monitor /health/ externally from Cloudflare/uptime tooling instead.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
