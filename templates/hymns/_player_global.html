{% comment %}
Audio player global Spotify-style. Renderizado em base.html FORA do <main>
para sobreviver ao swap do HTMX hx-boost. JS em static/js/player.js controla
visibilidade, estado e o <audio> element.

Layout PlayerBar (76px) — 3 colunas: now-playing | controls | actions.
Spec: _design/PLAYER_DESIGN.md §3.1.

Quando idle (state.visible=false), #player-root tem `hidden`.
{% endcomment %}
<div id="player-root" class="player-root hidden" data-player>
  <audio id="player-audio" preload="metadata"></audio>

  <div id="player-bar" class="player-bar">
    <div class="player-now" data-now>
      <div class="player-cover" data-cover><span data-cover-num>—</span></div>
      <div class="player-now-meta">
        <div class="player-title" data-title>—</div>
        <div class="player-sub" data-sub></div>
      </div>
    </div>

    <div class="player-controls" data-controls>
      <div class="player-buttons">
        <button type="button" data-prev class="player-btn" aria-label="Hino anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
        </button>
        <button type="button" data-play class="player-play" aria-label="Tocar" aria-pressed="false">
          <svg data-icon-play width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1 L12 7 L3 13 Z"/></svg>
          <svg data-icon-pause hidden width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="2" width="3" height="10"/><rect x="9" y="2" width="3" height="10"/></svg>
        </button>
        <button type="button" data-next class="player-btn" aria-label="Próximo hino">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
      <div class="player-progress">
        <span class="player-time" data-current>0:00</span>
        <input type="range" data-seek min="0" max="1000" value="0" step="1" aria-label="Progresso do hino">
        <span class="player-time" data-total>—</span>
      </div>
    </div>

    <div class="player-actions" data-actions>
      <button type="button" data-expand class="player-btn player-btn-sm" aria-label="Expandir player">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v6h6M20 10V4h-6M20 4l-7 7M4 20l7-7"/></svg>
      </button>
      <button type="button" data-close class="player-btn player-btn-sm" aria-label="Fechar player">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18L18 6"/></svg>
      </button>
    </div>
  </div>

  <div id="player-expanded" class="player-expanded hidden" role="dialog" aria-modal="true" aria-label="Player expandido">
    <div class="player-expanded-top">
      <button type="button" data-collapse class="player-btn-text">← Recolher</button>
      <span class="player-position" data-position>—</span>
      <span></span>
    </div>
    <div class="player-expanded-body">
      <div class="player-expanded-cover" data-cover-big>
        <span class="player-expanded-cover-num" data-cover-big-num>—</span>
      </div>
      <div class="player-expanded-info">
        <div class="player-expanded-eyebrow" data-expanded-eyebrow></div>
        <div class="player-expanded-title" data-expanded-title>—</div>
        <pre class="player-expanded-lyrics" data-lyrics></pre>
      </div>
    </div>
    <div class="player-expanded-controls">
      <div class="player-progress player-progress-big">
        <span class="player-time" data-current-big>0:00</span>
        <input type="range" data-seek-big min="0" max="1000" value="0" step="1" aria-label="Progresso">
        <span class="player-time" data-total-big>—</span>
      </div>
      <div class="player-buttons">
        <button type="button" data-prev class="player-btn" aria-label="Anterior">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
        </button>
        <button type="button" data-play class="player-play player-play-big" aria-label="Tocar">
          <svg data-icon-play width="20" height="20" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1 L12 7 L3 13 Z"/></svg>
          <svg data-icon-pause hidden width="20" height="20" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="2" width="3" height="10"/><rect x="9" y="2" width="3" height="10"/></svg>
        </button>
        <button type="button" data-next class="player-btn" aria-label="Próximo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
