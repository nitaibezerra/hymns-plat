{# Card colorido de hinário (Marco 2.1.1). Usa display_accent. #}
<a href="{% url 'hymns:hymnbook_detail' hb.slug %}" class="group block rounded-xl overflow-hidden shadow-soft border border-ink/10 hover:-translate-y-0.5 transition-transform" style="background: linear-gradient(140deg, {{ hb.display_accent }} 0%, color-mix(in srgb, {{ hb.display_accent }} 60%, black) 100%);">
  <article class="relative aspect-[3/4] p-6 text-cream flex flex-col">
    {% if hb.cover_image %}
      <img src="{{ hb.cover_image.url }}" alt="Capa de {{ hb.name }}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent pointer-events-none"></div>
    {% else %}
      <span class="absolute inset-0 grid place-items-center pointer-events-none" aria-hidden="true">
        <span class="font-serif text-[8rem] leading-none text-cream/20 group-hover:text-cream/30 transition-colors">{{ hb.name|first|upper }}</span>
      </span>
    {% endif %}
    <span class="label-mono opacity-80 text-cream/80 relative">EST. {{ hb.created_at|date:"Y" }}</span>
    <div class="mt-auto relative">
      <h3 class="font-serif text-2xl leading-tight">{{ hb.name }}</h3>
      <p class="label-mono mt-1 text-cream/80">{{ hb.owner_name }}</p>
      {% if not hb.is_published %}
        <p class="label-mono mt-2 inline-block bg-cream/15 px-2 py-0.5 rounded-full text-cream/90">RASCUNHO</p>
      {% endif %}
    </div>
  </article>
</a>
