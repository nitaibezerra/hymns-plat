{% extends 'base.html' %}
{% load i18n %}

{% block title %}Sair{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-16 text-center">
  <p class="label-mono">Conta</p>
  <h1 class="font-serif text-4xl mt-2">Sair?</h1>
  <p class="text-ink-soft mt-2">Você quer mesmo encerrar a sessão?</p>

  <form method="post" action="{% url 'account_logout' %}" class="mt-8 flex justify-center gap-3">
    {% csrf_token %}
    {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}
    <a href="/" class="btn-pill">Cancelar</a>
    <button type="submit" class="bg-rust text-cream rounded-full px-6 py-2.5 text-sm font-medium hover:opacity-90">Sair</button>
  </form>
</section>
{% endblock %}
